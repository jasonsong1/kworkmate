<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <meta
      name="description"
      content="K-Workmate — multi-site hiring, mobile paperless onboarding and GPS attendance for hospitality franchise groups."
    />
    <meta name="theme-color" content="#fafafa" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Paint in the back-office look straight away so the screen never flashes light first.
      // The sign-in screen and the applicant pages stay light.
      (function () {
        try {
          var publicPath = /^\/(login|register|forgot-password|reset-password|apply|interview|onboarding|mini-interview|video-interview)/.test(
            window.location.pathname
          );
          var saved = localStorage.getItem('kw_theme_v2');
          var dark = publicPath ? false : saved !== 'light';
          if (dark) {
            document.documentElement.classList.add('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#0b1120');
          }
        } catch (e) {}
      })();
    </script>
    <title>K-Workmate — Multi-site Hiring, Onboarding & Attendance</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
